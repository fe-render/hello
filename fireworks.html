<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>烟花</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #launchBtn {
    position: fixed;
    left: 50%;
    bottom: max(32px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    touch-action: manipulation;
    padding: clamp(12px, 4vw, 14px) clamp(22px, 8vw, 32px);
    font-size: clamp(15px, 4.5vw, 18px);
    font-weight: bold;
    color: #fff;
    background: linear-gradient(135deg, #ff5f6d, #ffc371);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(255, 100, 100, 0.5);
    z-index: 10;
    transition: transform 0.15s ease;
    font-family: system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
    white-space: nowrap;
  }
  #launchBtn:hover {
    transform: translateX(-50%) scale(1.05);
  }
  #launchBtn:active {
    transform: translateX(-50%) scale(0.95);
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<button id="launchBtn" type="button">🎉 放烟花</button>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;

// 手机屏幕多是高像素密度屏(如 devicePixelRatio=2~3),按 CSS 像素画
// 会糊。这里让画布的物理像素按 dpr 放大,再用 ctx.scale 缩回来画,
// 这样逻辑坐标(W/H)不用变,但线条和粒子在手机上会清晰锐利。
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
// iOS Safari 地址栏收起/展开、横竖屏切换都会触发 resize,
// 做一点防抖避免频繁重建画布
let resizeTimer;
function onResize() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resize, 150);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);

// 手机的 CPU/GPU 通常比桌面弱,窄屏时把粒子数量整体打个折扣,
// 避免烟花特效在手机上卡顿掉帧。
const perfScale = window.innerWidth < 600 ? 0.55 : 1;

// 防止手机浏览器在画布上滑动时触发页面回弹/滚动。
// 注意:只在触点落在画布上时才阻止,避免连带影响到按钮本身的
// 点击/触摸响应(之前绑在整个 document 上,曾导致手机端点击按钮
// 偶发无效)。
document.addEventListener('touchmove', e => {
  if (e.target === canvas) e.preventDefault();
}, { passive: false });

// ---------- 背景星空(增加真实的夜空氛围) ----------
const stars = [];
for (let i = 0; i < 150; i++) {
  stars.push({
    x: Math.random() * W,
    y: Math.random() * H * 0.7,
    r: Math.random() * 1.2 + 0.2,
    phase: Math.random() * Math.PI * 2,
  });
}

function drawStars(t) {
  ctx.save();
  ctx.globalCompositeOperation = 'source-over';
  for (const s of stars) {
    const tw = 0.5 + 0.5 * Math.sin(t * 0.002 + s.phase);
    ctx.globalAlpha = 0.15 + tw * 0.35;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

// ---------- 工具函数 ----------
function rand(a, b) { return a + Math.random() * (b - a); }

// 火花/粒子:统一用"上一帧位置 -> 当前位置"画一条线段,
// 配合叠加(lighter)混合模式和逐帧半透明覆盖,形成拖尾发光的效果,
// 比单纯画一个圆点真实得多。
class Spark {
  constructor(x, y, hue, opts = {}) {
    this.x = this.px = x;
    this.y = this.py = y;
    const angle = opts.angle ?? rand(0, Math.PI * 2);
    const speed = opts.speed ?? rand(1, 6);
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.hue = hue;
    this.sat = opts.sat ?? 100;
    this.life = this.maxLife = opts.life ?? rand(50, 90);
    this.size = opts.size ?? rand(1.5, 3);
    this.gravity = opts.gravity ?? 0.045;
    this.drag = opts.drag ?? 0.985;
    this.flicker = !!opts.flicker;
    this.canCrackle = !!opts.canCrackle && Math.random() < 0.35;
    this.crackled = false;
    this.dead = false;
  }

  update(sparksOut) {
    this.px = this.x;
    this.py = this.y;
    this.vx *= this.drag;
    this.vy *= this.drag;
    this.vy += this.gravity;
    this.x += this.vx;
    this.y += this.vy;
    this.life--;

    // "噼啪炸裂"型烟花:寿命过半后,小概率再炸出几颗细小的白色火星
    if (this.canCrackle && !this.crackled && this.life < this.maxLife * 0.45) {
      this.crackled = true;
      const n = Math.floor(rand(2, 5));
      for (let i = 0; i < n; i++) {
        sparksOut.push(new Spark(this.x, this.y, 48, {
          angle: rand(0, Math.PI * 2),
          speed: rand(0.5, 2.5),
          life: rand(15, 30),
          size: rand(1, 1.8),
          gravity: 0.03,
          drag: 0.96,
          sat: 20,
        }));
      }
    }

    if (this.life <= 0 || this.size <= 0.05) this.dead = true;
  }

  draw() {
    const t = Math.max(this.life / this.maxLife, 0); // 1 -> 0
    // 亮度曲线:刚炸开时接近白热,随后冷却褪到本身颜色,最后转暗熄灭
    const hot = Math.max(t - 0.75, 0) / 0.25; // 0~1,只在寿命刚开始的一段时间内为正
    const lightness = 55 + hot * 40;
    let alpha = t;
    if (this.flicker) alpha *= (0.4 + 0.6 * Math.abs(Math.sin(this.life * 0.9)));

    ctx.strokeStyle = `hsla(${this.hue}, ${this.sat}%, ${lightness}%, ${alpha})`;
    ctx.lineWidth = this.size;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(this.px, this.py);
    ctx.lineTo(this.x, this.y);
    ctx.stroke();
  }
}

// 上升的烟花弹:拖着一条暗黄色的尾焰,到达目标高度后爆炸
class Rocket {
  constructor(x) {
    this.x = this.px = x;
    this.y = this.py = H;
    this.targetY = rand(H * 0.15, H * 0.45);
    this.vx = rand(-0.4, 0.4);
    this.vy = -rand(9, 13);
    this.hue = Math.floor(rand(0, 360));
    this.done = false;
  }

  update(sparksOut) {
    this.px = this.x;
    this.py = this.y;
    this.vy += 0.03; // 上升过程中逐渐减速,模拟推力耗尽
    this.x += this.vx;
    this.y += this.vy;

    // 尾焰火花
    sparksOut.push(new Spark(this.x, this.y, 40, {
      angle: rand(0, Math.PI * 2),
      speed: rand(0, 0.6),
      life: rand(10, 20),
      size: rand(1, 1.6),
      gravity: 0.01,
      drag: 0.9,
      sat: 60,
    }));

    if (this.vy >= -1 || this.y <= this.targetY) {
      this.done = true;
      explode(this.x, this.y, this.hue, sparksOut);
    }
  }

  draw() {
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(this.px, this.py);
    ctx.lineTo(this.x, this.y);
    ctx.stroke();
  }
}

let rockets = [];
let sparks = [];
let flashes = []; // 爆炸瞬间的一圈明亮闪光

function explode(x, y, hue, sparksOut) {
  const type = ['peony', 'willow', 'crackle', 'ring'][Math.floor(rand(0, 4))];

  flashes.push({ x, y, r: 4, alpha: 1 });

  if (type === 'peony') {
    const count = Math.floor(rand(110, 160) * perfScale);
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + rand(-0.05, 0.05);
      sparksOut.push(new Spark(x, y, hue + rand(-15, 15), {
        angle, speed: rand(3, 7.5), life: rand(55, 85),
        size: rand(1.8, 3), gravity: 0.05, drag: 0.985,
      }));
    }
  } else if (type === 'willow') {
    const count = Math.floor(rand(70, 100) * perfScale);
    const willowHue = rand(35, 50); // 金黄色垂柳烟花
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + rand(-0.08, 0.08);
      sparksOut.push(new Spark(x, y, willowHue + rand(-6, 6), {
        angle, speed: rand(2, 5), life: rand(110, 160),
        size: rand(1.3, 2.2), gravity: 0.07, drag: 0.992, sat: 90,
        flicker: true,
      }));
    }
  } else if (type === 'crackle') {
    const count = Math.floor(rand(90, 130) * perfScale);
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + rand(-0.06, 0.06);
      sparksOut.push(new Spark(x, y, hue + rand(-10, 10), {
        angle, speed: rand(3, 6.5), life: rand(50, 75),
        size: rand(1.6, 2.6), gravity: 0.05, drag: 0.98,
        canCrackle: true,
      }));
    }
  } else { // ring
    const count = Math.floor(rand(90, 120) * perfScale);
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count;
      sparksOut.push(new Spark(x, y, hue, {
        angle, speed: rand(5, 5.6), life: rand(60, 90),
        size: rand(1.8, 2.6), gravity: 0.045, drag: 0.985,
      }));
    }
    // 内层再来一小圈对比色,更有层次
    const innerHue = (hue + 180) % 360;
    const innerCount = Math.floor(rand(40, 60) * perfScale);
    for (let i = 0; i < innerCount; i++) {
      const angle = (Math.PI * 2 * i) / innerCount;
      sparksOut.push(new Spark(x, y, innerHue, {
        angle, speed: rand(1.5, 2.2), life: rand(50, 70),
        size: rand(1.5, 2.2), gravity: 0.04, drag: 0.98,
      }));
    }
  }
}

function launchFirework() {
  const x = rand(W * 0.18, W * 0.82);
  rockets.push(new Rocket(x));
}

function fire() {
  const bursts = 1 + Math.floor(rand(0, 3));
  for (let i = 0; i < bursts; i++) {
    setTimeout(launchFirework, i * 220);
  }
}

// 有些手机上的 App 内置浏览器(比如微信)偶尔会让 touch 到 click 的
// 合成事件延迟或丢失,这里在 touchend 上直接触发一次作为保险,
// 并用 lastFireTime 做去重,避免同一次点击 touchend+click 都触发
// 导致连放两组烟花。
let lastFireTime = 0;
function fireOnce() {
  const now = Date.now();
  if (now - lastFireTime < 300) return;
  lastFireTime = now;
  fire();
}
const launchBtn = document.getElementById('launchBtn');
launchBtn.addEventListener('touchend', e => {
  e.preventDefault();
  fireOnce();
});
launchBtn.addEventListener('click', fireOnce);

let last = performance.now();
function loop(now) {
  const dt = now - last;
  last = now;

  // 用较低的覆盖透明度做逐帧淡化,保留更长的拖尾轨迹(类似长曝光摄影)
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(0, 0, 4, 0.18)';
  ctx.fillRect(0, 0, W, H);

  drawStars(now);

  // 之后所有发光元素都用叠加混合,颜色重叠处会自然变亮,更接近真实光效
  ctx.globalCompositeOperation = 'lighter';

  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    r.update(sparks);
    r.draw();
    if (r.done) rockets.splice(i, 1);
  }

  for (let i = flashes.length - 1; i >= 0; i--) {
    const f = flashes[i];
    f.r += 3.5;
    f.alpha *= 0.85;
    if (f.alpha < 0.02) { flashes.splice(i, 1); continue; }
    const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
    g.addColorStop(0, `rgba(255,255,255,${f.alpha})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    ctx.fill();
  }

  const nextSparks = [];
  for (let i = 0; i < sparks.length; i++) {
    const s = sparks[i];
    s.update(nextSparks);
    if (!s.dead) {
      s.draw();
      nextSparks.push(s);
    }
  }
  sparks = nextSparks;

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
